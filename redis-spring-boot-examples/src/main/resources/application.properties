# Web server port (8080 is Spring Boot's default; change it here if another app is using 8080).
server.port=8080

# ---------------------------------------------------------------------------
# Redis connection (the container from docker-compose.yml)
# ---------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Database 0, the same one the Jedis examples use; tests switch to 15.
spring.data.redis.database=0

# ---------------------------------------------------------------------------
# Caching (cache package)
# ---------------------------------------------------------------------------
# Store @Cacheable results in Redis.
spring.cache.type=redis
# Cached entries expire after 1 minute (Redis sets a TTL on each key).
spring.cache.redis.time-to-live=60s
# Keys look like "demo:cache:rates::USD" (prefix + cache name + "::" + key).
spring.cache.redis.key-prefix=demo:cache:

# ---------------------------------------------------------------------------
# Sessions (session package)
# ---------------------------------------------------------------------------
# Sessions are stored under "demo:sessions:sessions:<session-id>".
spring.session.data.redis.namespace=demo:sessions
# Sessions expire after 30 minutes of inactivity.
server.servlet.session.timeout=30m

# ---------------------------------------------------------------------------
# Examples
# ---------------------------------------------------------------------------
# How long the "remote" exchange-rate lookup pretends to take (shows what caching saves).
demo.rates.simulated-delay=2s
# Print the RedisTemplate tour on startup.
demo.startup-tour.enabled=true
